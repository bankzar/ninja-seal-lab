<!doctype html><html><head><title>Ninja Lab responsive QA</title><style>body{background:#090b08;margin:0;color:#ddd;font:12px sans-serif}nav{padding:8px;position:sticky;top:0;background:#303727;z-index:2;display:flex;gap:8px;align-items:center}button{padding:6px}#frame-wrap{transform-origin:top left}iframe{display:block;border:0;height:1250px;width:1440px}</style></head><body><nav>Layout QA <button data-size="1440">Desktop 1440</button><button data-size="768">Tablet 768</button><button data-size="390">Mobile 390</button><span id="result"></span></nav><div id="frame-wrap"><iframe src="/" title="Game responsive preview"></iframe></div><script>const frame=document.querySelector('iframe'),wrap=document.querySelector('#frame-wrap'),result=document.querySelector('#result');function size(width){frame.style.width=width+'px';wrap.style.transform='scale('+Math.min(1,(document.documentElement.clientWidth-12)/width)+')';frame.contentWindow.scrollTo(0,0);result.textContent=width+'px';}document.querySelectorAll('button').forEach(b=>b.onclick=()=>size(Number(b.dataset.size)));frame.onload=()=>size(1440);</script></body></html>
